name: Daily dashboard rebuild

on:
  schedule:
    # Every day at 09:00 UTC (~5am New York / 5pm Singapore)
    - cron: "0 9 * * *"
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab
  push:
    paths:
      # Rebuild immediately when model inputs change (e.g. live results recorded)
      - "live_results.json"
      - "wc2026_data.py"
      - "wc2026_history.py"
      - "wc2026_model.py"

permissions:
  contents: write

concurrency:
  group: daily-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild dashboard (train model + 20k simulations)
        run: python build_dashboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dashboard.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated daily rebuild ($(date -u +%Y-%m-%d))"
            git push
          fi
